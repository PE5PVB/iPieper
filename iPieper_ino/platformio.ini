; =====================================================================
;  iPieper - PlatformIO project configuratie
; =====================================================================
;  Deze map (iPieper_ino) is een zelfstandig project; alle software- en
;  IDE-bestanden staan hier. Te bouwen met:
;    - Arduino IDE : open iPieper_ino.ino
;    - VS Code     : open de map iPieper_ino (PlatformIO werkbalk verschijnt)
;
;  Gebruikt het officiele PlatformIO espressif32-platform, 6.x-lijn
;  (levert arduino-esp32 core 2.x). De sketch is core-agnostisch: de ledc-
;  API in panic mode switcht via #if ESP_ARDUINO_VERSION_MAJOR >= 3, dus
;  hij compileert ook op 3.x. Voor 3.x onder PlatformIO heb je de
;  pioarduino-fork nodig - die werkt op het moment niet met .ino-bestanden
;  door een toolchain-naam-mismatch ('xtensa-esp-elf' vs
;  'xtensa-esp32-elf' die PlatformIO Core verwacht). Snelste 3.x-test is
;  via de Arduino IDE Boards Manager.
;
;  Stroombesparing: CPU 80 MHz (laagste klok met werkende Bluetooth) en
;  flash 40 MHz. Bovendien zet setup() de klok zelf op 80 MHz.
;
;  Partitietabel: min_spiffs (2x 1.875 MB app + kleine SPIFFS) - vereist
;  voor OTA-updates via Bluetooth: twee app-partities zodat de ESP32 de
;  nieuwe firmware in de inactieve slot kan schrijven en daarna een atomic
;  partition-switch doet. Een huge_app (1 partitie) ondersteunt geen OTA.
;  Sluit aan op de PartitionScheme=min_spiffs in .vscode/arduino.json.
; =====================================================================

[platformio]
src_dir       = .
default_envs  = esp32dev

[env]
; Gedeelde configuratie voor alle envs.
board     = esp32dev                ; standaard ESP32 (WROOM-32)
framework = arduino

; --- Kloksnelheid / stroombesparing ---------------------------------
board_build.f_cpu      = 80000000L  ; 80 MHz: laagste klok met werkende Bluetooth
board_build.f_flash    = 40000000L  ; flash 40 MHz
board_build.flash_mode = dio

; --- Partitietabel --------------------------------------------------
board_build.partitions = min_spiffs.csv

; --- Upload + monitor -----------------------------------------------
upload_speed    = 921600
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder

; --- Bronfilter: negeer niet-broncode mappen ------------------------
build_src_filter =
    +<*>
    -<.pio/>
    -<.vscode/>
    -<build/>

; --- Externe libraries ----------------------------------------------
; JQ8400_Serial staat niet in de PlatformIO registry; daarom rechtstreeks
; vanaf GitHub. Vastpinnen kan met een tag/commit, bv. ...JQ8400_Serial.git#<commit>
lib_deps =
    https://github.com/sleemanj/JQ8400_Serial.git

[env:esp32dev]
; Officieel PlatformIO espressif32-platform, vastgepind op de 6.x-lijn.
; Nieuwere releases (7.x / 55.x) bundelen een hernoemde toolchain
; ('xtensa-esp-elf') die de .ino-preprocessor van PlatformIO Core nog niet
; herkent. Binnen ^6.0.0 krijg je wel automatisch patch-updates.
platform = espressif32 @ ^6.0.0
